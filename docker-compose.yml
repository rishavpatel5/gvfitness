services:
  # ==========================================
  # 1. POSTGRES DATABASE
  # ==========================================
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: gvfitness-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gvfitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gvfitness2026_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-gvfitness_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gvfitness} -d ${POSTGRES_DB:-gvfitness_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. BACKEND API & BIOMETRIC GATEWAY
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gvfitness-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"  # Main REST API & Invoices
      - "8081:8081"  # eSSL K90 Pro Device Gateway (/iclock push protocol)
    environment:
      PORT: 5000
      DEVICE_GATEWAY_PORT: 8081
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-gvfitness}:${POSTGRES_PASSWORD:-gvfitness2026_db_pass}@db:5432/${POSTGRES_DB:-gvfitness_db}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-gvfitness2026}
      PUBLIC_INVOICE_BASE_URL: ${PUBLIC_INVOICE_BASE_URL:-http://localhost:5373}
      PUBLIC_DIET_PLAN_BASE_URL: ${PUBLIC_DIET_PLAN_BASE_URL:-http://localhost:5373}
      WATI_DIET_PLAN_TEMPLATE: ${WATI_DIET_PLAN_TEMPLATE:-gvfitness_diet_plan_v1}
      WATI_API_ENDPOINT: ${WATI_API_ENDPOINT:-https://live-mt-server.wati.io}
      WATI_ACCESS_TOKEN: ${WATI_ACCESS_TOKEN:-}
      DEVICE_WHITELIST_SERIALS: ${DEVICE_WHITELIST_SERIALS:-*}
      DEVICE_DEBOUNCE_MINUTES: 3
      DEVICE_PUSH_DELAY_SECONDS: 10
      DEVICE_TIMEZONE: 5.5
    volumes:
      - backend_data:/app/backend/data

  # ==========================================
  # 3. FRONTEND WEB SPA
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_PUBLIC_INVOICE_BASE_URL: ${VITE_PUBLIC_INVOICE_BASE_URL:-http://localhost:5373}
        VITE_PUBLIC_DIET_PLAN_BASE_URL: ${VITE_PUBLIC_DIET_PLAN_BASE_URL:-http://localhost:5373}
    container_name: gvfitness-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5373:4173"  # Maps local 5373 to container's 4173
    environment:
      PORT: 4173

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
  backend_data:

